report_title: "FOMO preprocessing report"
report_comment: >
  Per-source/target annotation statistics from AGAT (summary headline +
  exhaustive per-feature-type detail) and transcript FASTA statistics from
  SeqKit. Generated by the FOMO pipeline.

# Strip pipeline-specific suffixes so MultiQC sample names line up across
# AGAT rows and SeqKit rows.
extra_fn_clean_exts:
  - ".spliced.renamed.fasta"
  - ".spliced.renamed"
  - ".renamed.fasta"
  - ".renamed"
  - ".spliced.fasta"
  - ".spliced"
  - ".stats"
  - "_mqc"
  - "_summary"
  - "_full"
  - ".tsv"

# ---------------------------------------------------------------------------
# Custom-content sections
# ---------------------------------------------------------------------------
# AGAT summary table  — curated headline metrics (one row per AGAT sample)
# AGAT full table     — exhaustive per-feature-type metrics (one row per
#                        top-level feature, e.g. mrna, lnc_rna)
# SeqKit stats table  — seqkit's tabular output ingested as custom_data
#                        because MultiQC 1.25.1 has no native seqkit module
# ---------------------------------------------------------------------------
custom_data:
  agat_summary:
    file_format: "tsv"
    section_name: "AGAT annotation statistics (summary)"
    description: "Headline counts and aggregate lengths from agat_sp_statistics --yaml."
    plot_type: "table"
    pconfig:
      id: "agat_summary_table"
      namespace: "AGAT summary"
  agat_full:
    file_format: "tsv"
    section_name: "AGAT annotation statistics (full)"
    description: >
      Exhaustive per-feature-type metrics from agat_sp_statistics --yaml.
      One row per top-level feature found in each annotation file
      (mrna, lnc_rna, gene, ...). Click column headers to sort, use the
      column visibility toggle to hide noise (percentile/longest/shortest).
    plot_type: "table"
    pconfig:
      id: "agat_full_table"
      namespace: "AGAT full"
      only_defined_headers: false
  seqkit_stats:
    file_format: "tsv"
    section_name: "SeqKit FASTA statistics"
    description: "Per-FASTA length / composition statistics from seqkit stats --all."
    plot_type: "table"
    pconfig:
      id: "seqkit_stats_table"
      namespace: "SeqKit"

# Custom file search patterns — match the file names emitted by AGAT_TO_MQC
# and SEQKIT_STATS.
sp:
  agat_summary:
    fn: "*_summary_mqc.tsv"
  agat_full:
    fn: "*_full_mqc.tsv"
  seqkit_stats:
    fn: "*_seqkit_mqc.tsv"

# Order custom_content sections so summary appears before the full detail.
custom_content:
  order:
    - "agat_summary"
    - "seqkit_stats"
    - "agat_full"

# Order top-level modules.
top_modules:
  - "custom_content"
