report_title: "FOMO pipeline report"
report_comment: >
  Annotation statistics (gff-feature-stats) on input and projected models,
  transcript FASTA stats (SeqKit), and projection-vs-reference comparison stats
  (gffcompare). Every source is aligned to this target in a single minimap2 run,
  so the Samtools sections describe that one merged alignment — one row per gene
  type, not per source species. Per-source counts are in the projected-model GFF
  statistics table, and per-source accuracy in the gffcompare sections, where
  <code>allModels_raw</code> (every source pooled; a species is never projected onto
  itself) appears as a pseudo-source. The curated annotation (intron chains shared by at
  least <code>--curate_min_species</code> species) heads the report.
  Generated by the FOMO pipeline.

# Native-module sample names come from file names: <target>.allModels.<track>.raw.stats
# (samtools) and <target>.from_<source>.<track>.gffcompare.stats (gffcompare). The custom
# content carries its own Sample labels.
extra_fn_clean_exts:
  - ".gffcompare"
  - ".stats"
  - ".raw"

# Descending order, one hundred per pipeline stage: curation (the deliverable) first, then the
# source annotations, the projection and the benchmarking. Software versions come last.
report_section_order:
  # 900 curation
  curation_novel:
    order: 930
  curation_discarded:
    order: 920
  curation_observed:
    order: 910
  # 800 source annotations
  transcript_filter:
    order: 850
  td2_coding:
    order: 840
  gffstats_input:
    order: 830
  gffstats_genes:
    order: 820
  seqkit_stats:
    order: 810
  # 700 projection
  gffstats_projection:
    order: 730
  samtools:
    order: 720
  samtools_align:
    order: 710
  # 600 benchmarking
  gffcompare_accuracy_custom:
    order: 620
  gffcompare:
    order: 610

# No General Statistics table: every metric is in a section below.
skip_generalstats: true

# The native samtools violin has a fixed column set (samtools_align shows the curated one; the
# "Percent mapped" chart stays), and the native gffcompare scatter names its points by level,
# not by sample (gffcompare_accuracy_custom replaces it; the novel/missing charts stay).
remove_sections:
  - samtools-stats
  - gffcompare_accuracy
