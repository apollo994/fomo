report_title: "FOMO pipeline report"
report_comment: >
  Annotation statistics (AGAT) on input and projected models, transcript
  FASTA stats (SeqKit), and projection-vs-reference comparison stats
  (gffcompare). Generated by the FOMO pipeline.

# Strip pipeline-specific suffixes so MultiQC sample names line up across
# AGAT rows and SeqKit rows.
extra_fn_clean_exts:
  - ".spliced.renamed.fasta"
  - ".spliced.renamed"
  - ".renamed.fasta"
  - ".renamed"
  - ".spliced.fasta"
  - ".spliced"
  - ".gffcompare"
  - ".stats"
  - "_mqc"
  - ".tsv"

report_section_order:
  agat_input:
    order: 1000
  agat_projection:
    order: 900
  seqkit_stats:
    order: 800
