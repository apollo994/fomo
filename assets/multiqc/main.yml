report_title: "FOMO pipeline report"
report_comment: >
  Annotation statistics (AGAT) on input and projected models, transcript
  FASTA stats (SeqKit), and projection-vs-reference comparison stats
  (gffcompare). Generated by the FOMO pipeline.

# Strip pipeline-specific suffixes so MultiQC sample names line up across
# AGAT rows and SeqKit rows.
extra_fn_clean_exts:
  - ".spliced.renamed.fasta"
  - ".spliced.renamed"
  - ".renamed.fasta"
  - ".renamed"
  - ".spliced.fasta"
  - ".spliced"
  - ".gffcompare"
  - ".stats"
  - "_mqc"
  - ".tsv"

report_section_order:
  agat_input:
    order: 1000
  agat_projection:
    order: 900
  samtools:
    order: 850
  samtools_align:
    order: 845
  seqkit_stats:
    order: 800

# Hide the top General Statistics table entirely — per-module sections
# below carry all the curated metrics we care about.
skip_generalstats: true

# Suppress the native Samtools "Alignment stats" violin (its column set is
# hardcoded in the samtools module and doesn't match our curated 7-column
# table). The "Percent mapped" bar chart (anchor: samtools-stats-alignment)
# and our `samtools_align` custom-content table are preserved.
remove_sections:
  - samtools-stats
  # Native gffcompare "Accuracy values" scatter names points by feature level,
  # not by sample, so its tooltips are uninformative. Replaced by our custom
  # scatter (gffcompare_accuracy_custom) which colours by source and shapes by
  # feature class. Native novel/missing charts are unaffected.
  - gffcompare_accuracy
