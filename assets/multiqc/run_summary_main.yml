report_title: "FOMO run summary"
report_comment: >
  One report for the whole run, alongside the per-target reports under
  <code>targets/&lt;target&gt;/multiqc/</code>. Everything here is an aggregate across
  targets and sources; per-target detail lives in those reports. A species is never
  projected onto <b>itself</b>: <code>allModels</code> pools every source except the
  target, and the accuracy heatmap has no diagonal. "Added" annotation is the curated
  set — intron chains shared exactly by at least two source species, none overlapping
  the target's reference — counted in genes.
  Generated by the FOMO pipeline.

# The aggregate tables carry an explicit Sample column, so filename cleaning barely
# matters here — these two keep the section anchors tidy.
extra_fn_clean_exts:
  - "_mqc"
  - ".tsv"

# MultiQC renders sections in DESCENDING order value. Ids are the custom_data keys
# (TSV sections, see run_summary_sections.yml) and the "id" field embedded in each
# self-describing *_mqc.json plot.
report_section_order:
  run_overview:
    order: 1100
  run_species:
    order: 1050
  run_source_funnel_plot:
    order: 1000
  run_source_funnel:
    order: 990
  run_target_types:
    order: 950
  run_target_before_after:
    order: 940
  # One section per metric: MultiQC 1.35 heatmaps take a single matrix, not a
  # dataset switcher (bargraphs do — see run_target_before_after).
  run_accuracy_heatmap_f1:
    order: 920
  run_accuracy_heatmap_sn:
    order: 910
  run_accuracy_heatmap_pr:
    order: 900
  run_aggregate_accuracy_plot:
    order: 860
  run_aggregate_accuracy:
    order: 850
  run_donor_ranking:
    order: 800

# No General Statistics table: every metric here is already in a curated section,
# and the run-level rows (species, targets, models) are not one sample space.
skip_generalstats: true
