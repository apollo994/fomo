# ---------------------------------------------------------------------------
# Custom-content sections
# ---------------------------------------------------------------------------
# gffstats_input      — GFF stats on input GFFs (source + target, raw/filtered/decoy)
# gffstats_genes      — gene-category breakdown of those same input GFFs
# gffstats_projection — GFF stats on projected GFFs (minimap2-then-BAM_TO_GFF output)
# seqkit_stats        — SeqKit FASTA length/composition stats
# transcript_filter   — source transcripts kept by FILTER_TRANSCRIPT (spliced → longest isoform)
# td2_coding          — TD2 coding-potential drops for real lncRNA (input + projected)
# ---------------------------------------------------------------------------
custom_data:
  gffstats_input:
    file_format: "tsv"
    section_name: "GFF statistics — input annotations"
    description: >
      Per-transcript-type counts and length statistics from gff-feature-stats.
      One row per (species × kind × transcript type), where `kind` is one of
      raw / lncRNA / decoy_lncRNA / mRNA / decoy_mRNA — the mRNA and decoy rows
      appear only with `--include_mrna` / `--include_decoy`. Transcript lengths are
      genomic spans; spliced lengths are summed exon lengths. Introns are not
      encoded in GFF3 and are derived from the gaps between a transcript's
      exons (`next.start − prev.end − 1`), so a single-exon-only transcript
      type shows NA for every intron and spliced-length column.
    plot_type: "table"
    pconfig:
      id: "gffstats_input_table"
      namespace: "GFF stats input"
  gffstats_genes:
    file_format: "tsv"
    section_name: "GFF statistics — gene categories (input annotations)"
    description: >
      Gene-level view of the same input annotations, split by the category
      gff-feature-stats assigns each gene: `coding` (has CDS, or biotype
      protein_coding), `pseudogene`, or `non_coding`. Counts aggregate over the
      whole file, so they span every transcript type at once.
    plot_type: "table"
    pconfig:
      id: "gffstats_genes_table"
      namespace: "GFF stats genes"
  gffstats_projection:
    file_format: "tsv"
    section_name: "GFF statistics — projected models"
    description: >
      gff-feature-stats on the minimap2-projected transcript models, computed
      against the target genome. One row per (target × source × feature_type ×
      decoy/not) — mRNA and decoy rows appear only with `--include_mrna` /
      `--include_decoy`. Projected models carry no CDS, so CDS columns are NA. The
      `from_combined` and `from_top3` rows come from gffread, whose GFF3 output
      has no gene features, so their n_genes reads 0.
    plot_type: "table"
    pconfig:
      id: "gffstats_projection_table"
      namespace: "GFF stats projection"
  seqkit_stats:
    file_format: "tsv"
    section_name: "SeqKit FASTA statistics"
    description: "Per-FASTA length / composition statistics from seqkit stats --all."
    plot_type: "table"
    pconfig:
      id: "seqkit_stats_table"
      namespace: "SeqKit"
  samtools_align:
    file_format: "tsv"
    section_name: "Samtools — Alignment statistics (curated)"
    description: >
      Curated set of alignment metrics parsed from `samtools stats` SN lines.
      One row per projected (target, source, feature_type, decoy/not) tuple —
      mRNA and decoy rows appear only with `--include_mrna` / `--include_decoy`.
    plot_type: "table"
    pconfig:
      id: "samtools_align_table"
      namespace: "Samtools alignment"
  transcript_filter:
    file_format: "tsv"
    section_name: "Transcript filter — spliced, longest isoform"
    description: >
      Source transcripts per feature type at each FILTER_TRANSCRIPT step:
      `n_transcripts` in the annotation, `n_stranded` on one defined strand (drops
      strand "?" and trans-spliced models, e.g. plant mitochondrial nad1/nad2),
      `n_spliced` with at least two exons, and
      `n_selected` kept — one per gene, the longest spliced isoform (by summed exon
      length), unless `--longest_isoform false`. One row per (source × feature
      type); mRNA rows appear only with `--include_mrna`. lncRNA are then
      TD2-filtered (next section).
    plot_type: "table"
    pconfig:
      id: "transcript_filter_table"
      namespace: "Transcript filter"
  td2_coding:
    file_format: "tsv"
    section_name: "TD2 coding potential — lncRNA filtered"
    description: >
      Real lncRNA dropped because TD2 (TransDecoder2) found a complete ORF with
      psauron_score >= the configured cutoff. One row per (sample × stage):
      `input` = source lncRNA before projection, `projected` = per-source
      projected lncRNA before consensus. mRNA and decoy tracks are never filtered
      (and are absent unless `--include_mrna` / `--include_decoy` are set).
    plot_type: "table"
    pconfig:
      id: "td2_coding_table"
      namespace: "TD2"

# Each section uses a unique filename suffix so MultiQC's sp pattern is
# the single source of routing. The GFF stats TSVs deliberately do NOT carry
# a `# id:` header — embedding one would cause MultiQC to discover the
# section twice (once via sp, once via the embedded id) and render every
# section twice in the report.
  curation_observed:
    file_format: "tsv"
    section_name: "Curation (1) — multi-species chains observed"
    description: >
      Intron chains shared EXACTLY (every splice junction identical; gffcompare --no-merge)
      by at least --curate_min_species source species, before any reference filter. One row
      per curated track (lncRNA; mRNA / decoys with --include_mrna / --include_decoy). The
      target's own projections are excluded first (`self_excluded`) and never count as
      support; single-exon models have no junction and are skipped. `genes` = supported
      chains grouped by a shared splice junction.
    plot_type: "table"
    pconfig:
      id: "curation_observed_table"
      namespace: "Curation observed"
  curation_discarded:
    file_format: "tsv"
    section_name: "Curation (2) — discarded by overlap with the reference"
    description: >
      Models with an exon overlapping ANY exon of the target's reference annotation on the
      same strand (every biotype) are removed before support is counted.
      `supported_chains_lost` = chains that fall below the species threshold as a result;
      `chains_lost:<type>` splits them by the overlapped reference type, one primary type
      per chain (mRNA > lncRNA > antisense > other transcript > small RNA > pseudogene), so
      those columns add up to `supported_chains_lost`. NA for targets without a reference.
    plot_type: "table"
    pconfig:
      id: "curation_discarded_table"
      namespace: "Curation discarded"
  curation_novel:
    file_format: "tsv"
    section_name: "Curation (3) — novel genes"
    description: >
      The curated annotation: one gene per group of supported chains sharing a splice
      junction, represented by its chain with the most splice junctions (then most
      species, longest, lowest de). Columns: genes by supporting species and by number of
      chains; `location:<class>` relative to the reference (antisense_exonic, intronic,
      sense_span_overlap, antisense_intronic, divergent, intergenic, no_reference); medians
      of exons, exonic length, genomic span, intron length and de of the representatives.
    plot_type: "table"
    pconfig:
      id: "curation_novel_table"
      namespace: "Curation novel"
sp:
  gffstats_input:
    fn: "*_gffstats_input_mqc.tsv"
  gffstats_genes:
    fn: "*_gffstats_genes_mqc.tsv"
  gffstats_projection:
    fn: "*_gffstats_projection_mqc.tsv"
  seqkit_stats:
    fn: "*_seqkit_mqc.tsv"
  samtools_align:
    fn: "*_samtools_align_mqc.tsv"
  transcript_filter:
    fn: "*_transcript_filter_mqc.tsv"
  td2_coding:
    fn: "*_td2_coding_mqc.tsv"
  curation_observed:
    fn: "*_curation_observed_mqc.tsv"
  curation_discarded:
    fn: "*_curation_discarded_mqc.tsv"
  curation_novel:
    fn: "*_curation_novel_mqc.tsv"
