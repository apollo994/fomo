# ---------------------------------------------------------------------------
# Custom-content sections of the run-level report
# ---------------------------------------------------------------------------
# Only the TABLES are declared here. The plots (*_mqc.json written by
# bin/run_summary_tables.py) are self-describing MultiQC custom content — they
# carry their own id / section_name / plot_type / pconfig — so they get NO
# custom_data block and NO sp pattern. A file discovered by BOTH an sp pattern and
# an embedded id renders its section TWICE (the same trap documented in
# assets/multiqc/sections.yml).
#
# Every filename suffix below is globally unique across the pipeline, so these can
# never be routed into a per-target report's sections and vice versa.
# ---------------------------------------------------------------------------
custom_data:
  run_overview:
    file_format: "tsv"
    section_name: "Run overview"
    description: >
      What this run was: species per role, how many of them donate annotation
      (sources), how many receive it (targets), how many of those have a reference
      annotation (used for curation), how many are benchmarked (role `both`: the
      gffcompare reference is the filtered annotation only donors have), the projection pair count, and the
      parameters the rest of the report must be read against.
    plot_type: "table"
    pconfig:
      id: "run_overview_table"
      namespace: "Run"
      sort_rows: false
      col1_header: "Metric"
  run_species:
    file_format: "tsv"
    section_name: "Species — roles and annotation input"
    description: >
      One row per species. `role` is what the samplesheet asked for; `is_source` /
      `is_target` are what it therefore does; `benchmarked` needs role `both` (a pure
      target's GFF3 is its curation reference only). The annotation columns are that species' own input
      annotation, so a pure target with no GFF3 shows NA — not zero.
    plot_type: "table"
    pconfig:
      id: "run_species_table"
      namespace: "Species"
      col1_header: "Species"
  run_source_funnel:
    file_format: "tsv"
    section_name: "Source lncRNA — extraction and filtering funnel"
    description: >
      What happened to each source's lncRNA between the samplesheet GFF3 and the
      transcripts actually offered for projection. Four filters apply, in order:
      models without a consistent strand are dropped (`dropped_unstranded`: strand "?"
      or trans-spliced across both strands — almost always zero for lncRNA), then
      single-exon transcripts (FOMO transfers spliced models only), then
      every spliced isoform but the longest of its gene (`dropped_non_longest`; zero
      with `--longest_isoform false`), then TD2/PSAURON drops anything with a
      complete, confident ORF. `kept` is what was donated — exactly the transcripts of
      the published `sources/<species>/annotation/<species>.lnc_RNA.filtered.gff3`. Lengths are for the kept set; transcript length is the genomic span,
      spliced length the summed exon length.
    plot_type: "table"
    pconfig:
      id: "run_source_funnel_table"
      namespace: "Source funnel"
      col1_header: "Species"
  run_target_types:
    file_format: "tsv"
    section_name: "Targets — genes before and after curation"
    description: >
      One row per (target × transcript type), in GENES. `genes_before` is the
      target's own reference annotation; `curated_genes` are the genes FOMO adds —
      intron chains shared exactly by at least `--curate_min_species` source species,
      none overlapping a reference exon (one representative model per gene).
      `genes_after` is the sum. A target with no GFF3 has no `genes_before` (NA): it is
      curated without a reference. `reads_mapped_percent` is the merged alignment's
      mapping rate for that class. With `--include_decoy`, `curated_decoy_genes` counts
      decoy chains that still met the species threshold (chance agreement: decoys are
      relocated per source into intergenic space), and `est_curated_fdr_pct` compares
      the decoy and real curation rates, each per multi-exon input model.
    plot_type: "table"
    pconfig:
      id: "run_target_types_table"
      namespace: "Targets"
      col1_header: "Target / type"
  run_aggregate_accuracy:
    file_format: "tsv"
    section_name: "allModels vs best single donor — accuracy"
    description: >
      gffcompare transcript-level accuracy per benchmarked target for `allModels_raw`
      (every source pooled, the target itself excluded), with `best_single_source`
      (the best real donor) as the baseline every `delta_f1` is measured against.
      With `--include_decoy` the decoy
      columns give the false-positive baseline: decoys are source loci relocated into
      the source's own intergenic space, so `est_fdr_pct` is decoy models as a
      percentage of real models — it can exceed 100% when the decoy track is as
      large as the real one.
    plot_type: "table"
    pconfig:
      id: "run_aggregate_accuracy_table"
      namespace: "Aggregates"
      col1_header: "Target / model"
  run_donor_ranking:
    file_format: "tsv"
    section_name: "Donors — how good is each source, run-wide"
    description: >
      Per source species, its lncRNA transcript-level F1 across every benchmarked
      target it was projected onto, and how many models it projects per target.
    plot_type: "table"
    pconfig:
      id: "run_donor_ranking_table"
      namespace: "Donors"
      col1_header: "Species"

sp:
  run_overview:
    fn: "*run_overview_mqc.tsv"
  run_species:
    fn: "*run_species_mqc.tsv"
  run_source_funnel:
    fn: "*run_source_funnel_mqc.tsv"
  run_target_types:
    fn: "*run_target_types_mqc.tsv"
  run_aggregate_accuracy:
    fn: "*run_aggregate_accuracy_mqc.tsv"
  run_donor_ranking:
    fn: "*run_donor_ranking_mqc.tsv"
